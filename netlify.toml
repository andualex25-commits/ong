[build]
command = "npm run build"
publish = "dist"
functions = ".netlify/functions"

[build.environment]
NODE_VERSION = "18"

[[redirects]]
from = "/api/stripe-webhook"
to = "/.netlify/functions/stripe-webhook"
status = 200
force = true

[[redirects]]
from = "/auth"
to = "/.netlify/functions/auth"
status = 200
